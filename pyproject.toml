[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reading-companion"
version = "0.1.0"
description = "Agentive reading companion for Spanish literary texts"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "openai>=1.30",
    "anthropic>=0.28",
    "google-generativeai>=0.7",
    "rich>=13.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
ner = ["spacy>=3.7"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"